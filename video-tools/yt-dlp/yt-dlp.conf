# yt-dlp defaults for video editing
# Copy this file to your home folder as yt-dlp.conf
#   Mac/Linux: ~/yt-dlp.conf
#   Windows:   C:\Users\<you>\yt-dlp.conf
# Anything you type on the command line overrides these lines.

# Prefer H.264 video + AAC audio in MP4. Premiere, Final Cut, CapCut and
# DaVinci all import this without converting. YouTube caps H.264 at 1080p.
-f "bv*[vcodec^=avc1]+ba[ext=m4a]/b[ext=mp4]/bv*+ba/b"
--merge-output-format mp4

# Save everything to one footage inbox
-P "~/Downloads/yt-dlp"

# Readable, short, unique filenames
-o "%(title).90B [%(id)s].%(ext)s"

# Grab one video even if the link points inside a playlist
--no-playlist

# Keep title, channel, date and chapters inside the file
--embed-metadata
